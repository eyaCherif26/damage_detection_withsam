# "Full" LoRA (as SAM3_LoRA/configs/full_lora_config.yaml: every component except the text encoder) on CIF,
# made to fit the 24 GB RTX PRO 4000 Blackwell. Separate, opt-in config: cif_24gb.yaml / cif_smoke_8gb.yaml
# and the repo's own configs are unaffected (they have no `optimizations:` block -> original code path).
# Memory measures: optimizations block (efficient attention + bf16 autocast), batch 1, num_negatives 0.
# Activation checkpointing of SAM 3's image encoder is already on by default in training (sam3/model/vitdet.py).
# Not measured yet: run a smoke test first (see VLM_test/PLAN.md) and watch nvidia-smi.
# Set data_dir / output_dir to the paths on the machine you train on.
model:
  name: "facebook/sam3"
  cache_dir: null
lora:
  rank: 32                         # as full_lora_config; rank barely affects GPU memory
  alpha: 64
  dropout: 0.1
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj", "qkv", "proj", "fc1", "fc2",
                   "c_fc", "c_proj", "linear1", "linear2"]
  apply_to_vision_encoder: true
  apply_to_text_encoder: false     # FROZEN, as in the repo's full config
  apply_to_geometry_encoder: true
  apply_to_detr_encoder: true      # needs optimizations.efficient_attention (else 5184x5184 matrices -> OOM)
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true
optimizations:                     # VLM_test patch, opt-in; omit the block = original behaviour
  efficient_attention: true        # lora_layers.MultiheadAttentionLoRA -> F.scaled_dot_product_attention
  bf16_autocast: true              # model forward in bf16, outputs cast back to fp32 for matcher + loss
training:
  data_dir: "/home/eyacherif/Projects/VLM_test/data/cif_sam3_1k"
  batch_size: 1
  num_workers: 8
  num_negatives: 0                 # ~5 instead of ~8 queries per image (absent CIF classes stay negatives)
  data_format: "coco"
  prompt_source: "category_name"
  learning_rate: 5e-5              # as full_lora_config (more trainable params than the decoder-only runs)
  weight_decay: 0.01
  num_epochs: 10
  seed: 42
  best_metric: val_macro_dice
eval:
  max_images: 300
  train_max_images: 100
  threshold: 0.5
  no_data_validity: true
wandb:
  entity: eya-cherif14
  project: damage_detection
  run_name: sam3_lora_cif_full_1k
  mode: online
  log_images_every_n_epochs: 2
  num_logged_images: 8
output:
  output_dir: "/home/eyacherif/Projects/VLM_test/outputs/sam3_cif_full_1k"
  save_lora_only: true
hardware:
  device: "cuda"
