# Qwen3-VL-8B vision encoder + LoRA + fpn_upernet_lite decoder, cif_coco ONLY (class-balanced training subset),
# NATIVE resolution: data.resize_mode native_crop (512 px crops at native scale for training, a full tile grid for
# test, no whole-image squeeze). Data settings copied 1:1 from MVP_clean's segformer_native_cif_512.yaml, training
# settings as qwen3vl_cif_512.yaml (lr_backbone applies to the LoRA weights).
# Consistent with orthophoto inference (scripts/infer_orthophoto.py tiles at native scale).
# Run with VLM_test/scripts/run_mvp_clean.py and configs/qwen3vl/backbone_lora.yaml.
# SET the cif_coco dataset path below for your machine.
name: qwen3vl_native_cif_512
seed: 42
data:
  sources:
  - cif_coco
  dataset_config_paths:
    cif_coco: /path/to/VLM_test/configs/qwen3vl/datasets/cif_coco_balanced.yaml
  mvp_classes:
  - Cracks
  - Wetspot
  - Spalling
  - Rust
  - Efflorescence
  image_size: 512                  # crop / tile size (multiple of 32, as the Qwen backbone needs)
  dacl10k_test_strategy: carve_val_from_train
  dacl10k_val_fraction: 0.1
  split_seed: 42
  batch_size: 8
  num_workers: 4
  resize_mode: native_crop
  pixel_scale: 1.0                 # native pixels
  train_scale_jitter: 0.25
  fg_crop_prob: 0.7
  train_crops_per_image: 1
  val_crops_per_image: 1
model:
  name: qwen3vl_semantic
  encoder_name: Qwen/Qwen3-VL-8B-Instruct
  init_mode: from_scratch          # = no earlier damage checkpoint; the Qwen vision weights are loaded by the backbone
  dropout: 0.2
  num_classes: 5
  thin_structure_classes:
  - Cracks
loss:
  focal_weight: 1.0
  dice_weight: 1.0
  boundary_weight: 0.0
  dice_variant: tversky
  default_alpha: 0.25
  default_gamma: 2.0
  tversky_alpha: 0.3
  tversky_beta: 0.7
  per_class_alpha:
    Cracks: 0.35
  per_class_gamma:
    Cracks: 2.5
training:
  max_epochs: 30
  warmup_epochs: 2
  lr_head: 0.0005
  lr_backbone: 1.0e-04             # LoRA weights
  weight_decay: 0.01
  grad_clip_max_norm: 1.0
  frozen_epochs: 2
  early_stopping_patience: 5
  early_stopping_min_delta: 0.0001
  early_stopping_metric: val_macro_dice
  device: cuda
  amp: true
  grad_accum_steps: 1
  checkpoint_dir: runs
augmentation:
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotate90_p: 0.5
  shift_scale_rotate_p: 0.5
  shift_limit: 0.05
  scale_limit: 0.1
  rotate_limit: 15
  blur_p: 0.3
  blur_sigma_min: 0.4
  blur_sigma_max: 2.5
  color_jitter_p: 0.5
  brightness_limit: 0.2
  contrast_limit: 0.2
  hue_shift_limit: 5
wandb:
  entity: eya-cherif14
  project: damage_detection
  mode: online
  log_images_every_n_epochs: 5
  num_logged_images: 8
